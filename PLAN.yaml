# ============================================================================
# BLOCKERS (known from previous attempts)
# ============================================================================

blockers:
  google_maps: "Consent wall — headless browser cannot bypass"
  bing: "Returns empty via curl and Obscura for local Spanish queries"
  duckduckgo: "CAPTCHA on first query"
  overpass: "Intermittent availability (HTTP 406). Worked in this round for pubs, hotels, medical."
  mcp_fetch: "HTTP 403/404 for many Spanish news/sites"
  cloudflare: "Blocks ProZ.com, Lucas Fox, Idealista, TopDoctors, Savills, ATA, Sanitas, Adeslas"
  doctoralia: "SPA routing — all direct URLs return 404"
  workaround: "TranslatorsCafe.com + Yelp.es + Expat.com + Overpass + direct website verification"
  new_tools_unblocked:
    translatorscafe: "✅ Worked. 162 EN>ES translators in Seville."
    yelp_es: "✅ Worked for medical/dental keyword search. Weak signal (no explicit EN confirmation)."
    overpass_medical: "✅ Worked. 30+ clinics/dentists with verified GPS+phones."
    expat_directory: "✅ Worked. 6 expat service providers with phone numbers."
  remaining: "Manual interactive browser session still needed for Cloudflare sites (ProZ.com, Lucas Fox, TopDoctors) and to verify individual websites of medical/dental providers."
