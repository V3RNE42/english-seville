# Those are in V3RNE42/centros_compatibles.
#
# Categories to research below. Each category gets its own branch of work.
# ============================================================================

meta:
  repo: "V3RNE42/english-seville"
  scope: "Seville city (postcodes 41001-41020)"
  excludes: ["schools", "language academies", "colleges", "universities"]
  excludes_repo: "https://github.com/V3RNE42/centros_compatibles"
  status_legend:
    "🟢": "Complete (≥5 verified entries with phone+web+address+GPS)"
    "🟡": "Partial (1-4 entries or incomplete data)"
    "🔴": "Not researched"

categories:
  - id: "pubs"
    name: "British / Irish Pubs & English-language Bars"
    status: "🟡"
    entries: 5
    notes: "5 pubs found via OSM (The Merchant, O'Neill's ×2, The Clan Scottish, The Boss). No phone/web in OSM data. Dubliners and others not found in OSM."
    data_needed: ["phone", "web", "email"]
    search_terms:
      - "British pub Seville"
      - "Irish pub Seville"
      - "English bar Seville"
      - "pub inglés Sevilla"

  - id: "hotels"
    name: "Hotels & Accommodation (English-first)"
    status: "🟡"
    entries: 6
    notes: "6 hotels verified (Alfonso XIII, Gran Meliá Colón, Inglaterra, Alcázar, Villapanes, Las Casas de El Arenal). Only Hotel Inglaterra has phone+web+email. Need phone for the rest."
    data_needed: ["phone", "email"]
    search_terms:
      - "English-speaking hotel Seville"
      - "international hotel Seville english"
      - "boutique hotel Seville english staff"

  - id: "tours"
    name: "Tourist Guides / Tour Operators (English)"
    status: "🟡"
    entries: 3
    notes: "3 tour operators verified (White Umbrella Tours, Fite Tours, Best Of Sevilla Tour). 2 have phone+web+email. Best Of Sevilla Tour listed on GuruWalk with no direct website."
    data_needed: ["address", "gps"]
    search_terms:
      - "English walking tour Seville"
      - "free tour Seville english"
      - "tour guide Seville english"
      - "food tour Seville english"

  - id: "coworking"
    name: "Coworking Studios & Business Centres"
    status: "🟡"
    entries: 4
    notes: "4 spaces verified (Arcadia, Gallo Rojo, INN Offices, Spaces). Arcadia has full data. Gallo Rojo limited English. INN Offices verified via website. Spaces via OSM."
    data_needed: ["phone", "address"]
    search_terms:
      - "coworking Seville english"
      - "digital nomad Seville coworking"
      - "business centre Seville"

  - id: "food"
    name: "International Food Stores & Specialty Groceries"
    status: "🟡"
    entries: 1
    notes: "Taste of America verified. No new food stores found. British shops, international delis remain unresearched."
    data_needed: ["address", "phone", "email"]
    search_terms:
      - "British food shop Seville"
      - "international supermarket Seville"
      - "American food store Seville"
      - "imported food Seville"

  - id: "expat-services"
    name: "Expat Services (Legal, Tax, Relocation)"
    status: "🟡"
    entries: 6
    notes: "6 providers found via Expat.com directory (TrustedSeville, movetosevilla.com, Relocations Sevilla Center, Llucia Abogados, Tatiana Vialaret, Wolffinance). All have phone. Websites mostly not found."
    data_needed: ["web", "email"]
    search_terms:
      - "English-speaking lawyer Seville"
      - "English accountant Seville"
      - "relocation services Seville"
      - "gestoría inglés Sevilla"

  - id: "translation"
    name: "Translation & Interpretation Services"
    status: "🟡"
    entries: 1
    notes: "TranslatorsCafe.com returned 162 EN>ES translators in Seville. Alfonso Amo verified with phone+address. 25+ individual names confirmed. ATA, ACT blocked. ProZ.com Cloudflare. Best source so far: TranslatorsCafe."
    data_needed: ["phone", "web", "email"]
    search_terms:
      - "English translator Seville"
      - "translation services Seville"
      - "interpreter Seville english"

  - id: "medical"
    name: "English-speaking Medical / Dental"
    status: "🟡"
    entries: 0
    notes: "Yelp 'english' keyword search returned 7 medical/dental leads (Consulta Médica Nervión, Centro Médico Cervantes Castilla, Clínica Dental Aníbal González, etc.). Overpass found 30+ clinics/dentists with verified phones. However, NONE explicitly confirm English-speaking staff. Need individual calls or website checks."
    data_needed: ["name", "address", "phone", "web", "gps"]
    search_terms:
      - "English-speaking doctor Seville"
      - "English dentist Seville"
      - "international clinic Seville"
      - "private hospital Seville english"

  - id: "real-estate"
    name: "Real Estate Agencies (English-speaking)"
    status: "🟡"
    entries: 1
    notes: "Engel & Völkers Seville verified with English site. Lucas Fox, Remax, Savills partially verified (blocked by Cloudflare). Need manual browser session for full details."
    data_needed: ["address", "phone", "email"]
    search_terms:
      - "English-speaking estate agent Seville"
      - "real estate Seville english"
      - "international property Seville"

# ============================================================================
# METHODOLOGY
# ============================================================================

methodology:
  layer_0_scraping_tools:
    description: "Check user's GitHub repos for existing scraping utilities"
    notes: >
      User mentioned GitHub repos containing scraping scripts and approaches
      that could accelerate data collection — not pre-existing data repos.
      Review repos for: headless browser scripts, phone extraction patterns,
      Overpass query builders, directory scraper templates, OSINT utilities.
  layer_1_open_data:
    description: "No open data CSV for these categories — skip"
    status: "not applicable"
  layer_2_web_scraping:
    description: "5-level scrape per entity"
    levels:
      - "JSON-LD extraction"
      - "tel:/wa.me/data-phone attributes"
      - "phonenumbers library (Python)"
      - "Obscura headless browser"
      - "OCR (Tesseract) — last resort"
  layer_2b_search_engines:
    description: "Bing via Obscura for initial discovery"
    warning: "Geo-located results. Always add 'Seville' explicitly."
  layer_2c_overpass:
    description: "OSM Overpass API for each category"
    query_template: |
      [out:json];
      area["name"="Seville"]["admin_level"="7"];
      (node[KEY=VALUE](area); way[KEY=VALUE](area); rel[KEY=VALUE](area););
      out center 30;
    osm_tags_by_category:
      pubs: "amenity=pub"
      hotels: "tourism=hotel"
      coworking: "office=coworking"
      food: "shop=supermarket OR shop=convenience OR shop=deli"
  layer_3_accept_not_found:
    description: "After exhausting layers, report NOT_FOUND. Never hallucinate."

verification:
  url: "curl -sI --max-time 6 URL | head -1 (2xx/3xx + title match)"
  phone: "Filter by Sevilla prefix (95/954/955/6/7) + 9 digits"
  address: "Nominatim API for coordinates"
  golden_rule: "HTTP 200 ≠ correct site. Check <title>."

