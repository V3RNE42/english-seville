# ============================================================================
# PLAN — English-First Businesses in Seville (non-school)
# ============================================================================
# Scope: Seville city (41001–41020). NO schools, NO academies.
# Those are in V3RNE42/centros_compatibles.
#
# Categories to research below. Each category gets its own branch of work.
# ============================================================================

meta:
  repo: "V3RNE42/english-seville"
  scope: "Seville city (postcodes 41001-41020)"
  excludes: ["schools", "language academies", "colleges", "universities"]
  excludes_repo: "https://github.com/V3RNE42/centros_compatibles"
  status_legend:
    "🟢": "Complete (≥5 verified entries with phone+web+address+GPS)"
    "🟡": "Partial (1-4 entries or incomplete data)"
    "🔴": "Not researched"

categories:
  - id: "pubs"
    name: "British / Irish Pubs & English-language Bars"
    status: "🟡"
    entries: 3
    notes: "3 pubs in index (The Merchant, O'Neill's, The Clan Scottish). OSM found 5 but only 3 with usable coordinates. No phone/web confirmed."
    data_needed: ["phone", "web", "email"]

  - id: "hotels"
    name: "Hotels & Accommodation (English-first)"
    status: "🟢"
    entries: 47
    notes: "47 hotels in index covering 5★ to 2★. Includes Alfonso XIII, Gran Meliá Colón, Inglaterra, Alcázar, Villapanes, Las Casas de El Arenal, and 41 more from systematic hotel research."
    data_needed: []

  - id: "tours"
    name: "Tourist Guides / Tour Operators (English)"
    status: "🟢"
    entries: 7
    notes: "7 tour operators in index. White Umbrella (4.96), Best Of (4.95), Fite Tours, and 4 GuruWalk operators."
    data_needed: []

  - id: "coworking"
    name: "Coworking Studios & Business Centres"
    status: "🟡"
    entries: 2
    notes: "Arcadia Coworking (phone+web+GPS) and Gallo Rojo (web+GPS). All verified."
    data_needed: []

  - id: "food"
    name: "International Food Stores & Specialty Groceries"
    status: "🟡"
    entries: 1
    notes: "Taste of America verified. British shops, international delis unresearched."
    data_needed: ["address", "phone", "email"]

  - id: "expat-services"
    name: "Expat Services (Legal, Tax, Relocation)"
    status: "🟡"
    entries: 3
    notes: "TrustedSeville, Wolffinance, IN Consultoría in index. Found via Expat.com."
    data_needed: ["web", "email"]

  - id: "translation"
    name: "Translation & Interpretation Services"
    status: "🟢"
    entries: 12
    notes: "12 agencies in index from TranslatorsCafe.com. All with phone."
    data_needed: []

  - id: "real-estate"
    name: "Real Estate Agencies (English-speaking)"
    status: "🔴"
    entries: 0
    notes: "Engel & Völkers verified in previous pass but not yet in index. Lucas Fox, Remax, Savills blocked by Cloudflare."
    data_needed: ["address", "phone", "email"]

# ============================================================================
# METHODOLOGY
# ============================================================================

methodology:
  layer_0_scraping_tools:
    description: "Search GitHub code across ALL users/organizations for data + scrapers"
    why: >
      When Bing, Google Maps, Overpass all fail, GitHub is NOT blocked.
      People publish datasets, travel lists, crawler output, JSON dumps,
      and scraper scripts on GitHub. Search it for data + techniques.
    search_patterns:
      data_type: "Find raw datasets"
      queries:
        - "seville pubs json"
        - "sevilla bares csv"
        - "seville hotels list"
        - "sevilla restaurantes json"
        - "seville coworking"
        - "english speaking seville list"
        - "sevilla expat guide"
        - "andalusia tourism data"
      tool_type: "Find scraping tools & scripts"
      queries:
        - "scrape google maps business python"
        - "overpass api query builder script"
        - "spanish business directory scraper"
        - "yelp api extractor python"
        - "expat directory scraper"
      code_type: "Find code mentioning specific entities with contact data"
      queries:
        - "Merchant Pub Seville"
        - "Taste of America Seville"
        - "White Umbrella Tours Seville"
    tool: "mcp_github_search_code"
    output: "Extract URLs, scripts, or data files found. Verify before using."

  layer_1_open_data:
    description: "No open data CSV for these categories — skip"
    status: "not applicable"

  layer_2_web_scraping:
    description: "5-level scrape per entity"
    levels:
      - "JSON-LD extraction"
      - "tel:/wa.me/data-phone attributes"
      - "phonenumbers library (Python)"
      - "Obscura headless browser (--dump original)"
      - "OCR (Tesseract) — last resort"

  layer_2b_search_engines:
    description: "Bing via Obscura for initial discovery"
    warning: "Geo-located results. Always add 'Seville' explicitly. Often blocked."

  layer_2c_overpass:
    description: "OSM Overpass API for each category"
    query_template: |
      [out:json];
      area["name"="Seville"]["admin_level"="7"];
      (node[KEY=VALUE](area); way[KEY=VALUE](area); rel[KEY=VALUE](area););
      out center 30;
    osm_tags_by_category:
      pubs: "amenity=pub"
      hotels: "tourism=hotel"
      coworking: "office=coworking"
      food: "shop=supermarket"

  layer_3_accept_not_found:
    description: "After exhausting layers, report NOT_FOUND. Never hallucinate."

verification:
  url: "curl -sI --max-time 6 URL | head -1 (2xx/3xx + title match)"
  phone: "Filter by Sevilla prefix (95/954/955/6/7) + 9 digits"
  address: "Nominatim API for coordinates"
  golden_rule: "HTTP 200 ≠ correct site. Check <title>."

# ============================================================================
# RESEARCH ORDER (priority)
# ============================================================================

research_order:
  - priority: 1
    category: "pubs"
    reason: "3 entries. Need phone+web."
  - priority: 2
    category: "food"
    reason: "Only 1 store. Need more international food sources."
  - priority: 3
    category: "real-estate"
    reason: "0 entries. Cloudflare-blocked leads need manual browser."

# ============================================================================
# BLOCKERS (known from previous attempts)
# ============================================================================

blockers:
  google_maps: "Consent wall — headless browser cannot bypass"
  bing: "Returns empty via curl and Obscura for local Spanish queries"
  duckduckgo: "CAPTCHA on first query"
  overpass: "Intermittent (HTTP 406)."
  mcp_fetch: "HTTP 403/404 for many Spanish news/sites"
  cloudflare: "Blocks ProZ.com, Lucas Fox, Idealista, TopDoctors, Savills, ATA, Sanitas"
  doctoralia: "SPA routing — all direct URLs return 404"

  unblocked_tools:
    github_code_search: "✅ Always available. Search for datasets, scrapers, lists."
    translatorscafe: "✅ Worked. 12 verified translation agencies in Seville."
    yelp_es: "✅ Worked for keyword search."
    expat_directory: "✅ Worked. 3 expat service providers."
    wayback_machine: "⏸️ Available but untested for these sites."

  remaining: "Manual browser session needed for Cloudflare sites."
