    data_needed: ["address", "gps"]
    search_terms:
      - "English walking tour Seville"
      - "free tour Seville english"
      - "tour guide Seville english"
      - "food tour Seville english"

  - id: "coworking"
    name: "Coworking Studios & Business Centres"
    status: "🟡"
    entries: 4
    notes: "4 spaces verified (Arcadia, Gallo Rojo, INN Offices, Spaces). Arcadia has full data. Gallo Rojo limited English. INN Offices verified via website. Spaces via OSM."
    data_needed: ["phone", "address"]
    search_terms:
      - "coworking Seville english"
      - "digital nomad Seville coworking"
      - "business centre Seville"

  - id: "food"
    name: "International Food Stores & Specialty Groceries"
    status: "🟡"
    entries: 1
    notes: "Taste of America verified. No new food stores found. British shops, international delis remain unresearched."
    data_needed: ["address", "phone", "email"]
    search_terms:
      - "British food shop Seville"
      - "international supermarket Seville"
      - "American food store Seville"
      - "imported food Seville"

  - id: "expat-services"
    name: "Expat Services (Legal, Tax, Relocation)"
    status: "🟡"
    entries: 6
    notes: "6 providers found via Expat.com directory (TrustedSeville, movetosevilla.com, Relocations Sevilla Center, Llucia Abogados, Tatiana Vialaret, Wolffinance). All have phone. Websites mostly not found."
    data_needed: ["web", "email"]
    search_terms:
      - "English-speaking lawyer Seville"
      - "English accountant Seville"
      - "relocation services Seville"
      - "gestoría inglés Sevilla"

  - id: "translation"
    name: "Translation & Interpretation Services"
    status: "🔴"
    entries: 0
    notes: "No individual translators verified. ProZ.com blocked by Cloudflare. Spanish Translator Services portal reached but individual details not extractable. Manual browser needed."
    data_needed: ["name", "phone", "web"]
    search_terms:
      - "English translator Seville"
      - "translation services Seville"
