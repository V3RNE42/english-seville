# ============================================================================
# METHODOLOGY
# ============================================================================

methodology:
  layer_0_reuse:
    description: "Check existing repos for relevant entities"
    repos_to_check:
      - "V3RNE42/centros_compatibles (only non-school entities)"
  layer_1_open_data:
    description: "No open data CSV for these categories — skip"
    status: "not applicable"
  layer_2_web_scraping:
    description: "5-level scrape per entity"
    levels:
      - "JSON-LD extraction"
      - "tel:/wa.me/data-phone attributes"
      - "phonenumbers library (Python)"
      - "Obscura headless browser"
      - "OCR (Tesseract) — last resort"
  layer_2b_search_engines:
    description: "Bing via Obscura for initial discovery"
    warning: "Geo-located results. Always add 'Seville' explicitly."
  layer_2c_overpass:
    description: "OSM Overpass API for each category"
    query_template: |
      [out:json];
      area["name"="Seville"]["admin_level"="7"];
      (node[KEY=VALUE](area); way[KEY=VALUE](area); rel[KEY=VALUE](area););
      out center 30;
    osm_tags_by_category:
      pubs: "amenity=pub"
      hotels: "tourism=hotel"
      coworking: "office=coworking"
      food: "shop=supermarket OR shop=convenience OR shop=deli"
  layer_3_accept_not_found:
    description: "After exhausting layers, report NOT_FOUND. Never hallucinate."

verification:
  url: "curl -sI --max-time 6 URL | head -1 (2xx/3xx + title match)"
  phone: "Filter by Sevilla prefix (95/954/955/6/7) + 9 digits"
  address: "Nominatim API for coordinates"
  golden_rule: "HTTP 200 ≠ correct site. Check <title>."

# ============================================================================
# RESEARCH ORDER (priority)
# ============================================================================

research_order:
  - priority: 1
    category: "pubs"
    reason: "Already started (1 entry). Most visible English-first category."
  - priority: 2
    category: "tours"
    reason: "High visibility, many operators, relatively easy to verify."
  - priority: 3
    category: "hotels"
    reason: "Good web presence, easy to verify."
  - priority: 4
    category: "food"
    reason: "Already started (1 entry). Small category to complete."
  - priority: 5
    category: "coworking"
    reason: "Digital nomad hub — likely several spaces."
  - priority: 6
    category: "expat-services"
    reason: "Harder to find but valuable for expat community."
  - priority: 7
    category: "translation"
    reason: "Small category, few providers."
  - priority: 8
    category: "medical"
    reason: "Important but difficult to verify English proficiency."
  - priority: 9
    category: "real-estate"
    reason: "Many agencies claim English — need to distinguish marketing from real capability."

# ============================================================================
# BLOCKERS (known from previous attempts)
# ============================================================================

blockers:
  google_maps: "Consent wall — headless browser cannot bypass"
  bing: "Returns empty via curl and Obscura for local Spanish queries"
  duckduckgo: "CAPTCHA on first query"
  overpass: "Intermittent availability (HTTP 406). Zero pubs tagged in Seville OSM."
  mcp_fetch: "HTTP 403/404 for many Spanish news/sites"
  workaround: "Reuse from related projects + direct website verification + manual known entries"
