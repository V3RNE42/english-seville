# ============================================================================
# BLOCKERS (known from previous attempts)
# ============================================================================

blockers:
  google_maps: "Consent wall — headless browser cannot bypass"
  bing: "Returns empty via curl and Obscura for local Spanish queries"
  duckduckgo: "CAPTCHA on first query"
  overpass: "Intermittent (HTTP 406). Worked for pubs, hotels, medical."
  mcp_fetch: "HTTP 403/404 for many Spanish news/sites"
  cloudflare: "Blocks ProZ.com, Lucas Fox, Idealista, TopDoctors, Savills, ATA, Sanitas"
  doctoralia: "SPA routing — all direct URLs return 404"

  unblocked_tools:
    github_code_search: "✅ Always available. Search for datasets, scrapers, lists."
    translatorscafe: "✅ Worked. 162 EN>ES translators in Seville."
    yelp_es: "✅ Worked for keyword search. Weak English-confirmation signal."
    overpass_generic: "✅ Worked for pubs, hotels, coworking, medical."
    expat_directory: "✅ Worked. 6 expat service providers."
    wayback_machine: "⏸️ Available but untested for these sites."

  remaining: "Manual browser session needed for Cloudflare sites. Phone calls needed to confirm English-speaking medical staff."
